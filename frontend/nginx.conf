server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Solo viajan formularios JSON pequeños.
    client_max_body_size 1m;

    charset utf-8;

    # Un location con add_header propio deja de heredar TODOS los del servidor: por eso
    # estas cabeceras se repiten abajo. 'unsafe-inline' solo en estilos (React los inyecta).
    add_header X-Frame-Options        "DENY"                            always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/manifest+json
                      image/svg+xml;

    # Sin add_header propio: hereda las cabeceras de seguridad del servidor.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Con una variable en proxy_pass el nombre se resuelve en cada petición y no al arrancar:
    # el sitio levanta aunque el backend no exista aún. Como ya no se reemplaza el prefijo,
    # la ruta se rearma con $1 y $is_args$args.
    location ~ ^/api/(.*)$ {
        # DNS interno de Docker; valid=10s tolera que el backend cambie de IP al reiniciarse.
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $destino_backend http://backend:8081;
        proxy_pass $destino_backend/api/$1$is_args$args;

        proxy_http_version 1.1;

        # La auditoría registra X-Forwarded-For: queda la IP real del usuario, no la de nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Alineados con el timeout de 20 s de clienteHttp.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        add_header Cache-Control "no-store" always;

        add_header X-Frame-Options        "DENY"                            always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Nombres con hash de Vite: cache indefinida. =404 para no servir index.html donde se espera JS o CSS.
    location /assets/ {
        access_log off;
        try_files $uri =404;

        # Sin "expires": emite su propio Cache-Control y la cabecera saldría duplicada.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        add_header X-Frame-Options        "DENY"                            always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Sin cache: apunta a los assets de la versión vigente tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        # Aquí la repetición es imprescindible: este es el documento que debe llevar la CSP.
        add_header X-Frame-Options        "DENY"                            always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Sin "error_page 404 /index.html": convertiría también los errores de la API en HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos ocultos (.env, .git).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
